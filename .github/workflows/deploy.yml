name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: overbranch-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy OverBranch on AWS EC2
    if: github.repository == 'overbranch/overbranch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST || secrets.AZURE_VM_IP }}
          username: ${{ secrets.EC2_USER || secrets.AZURE_VM_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.AZURE_VM_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || secrets.AZURE_VM_PORT || 22 }}
          command_timeout: 60m
          envs: DEPLOY_ENV_FILE
          script: |
            set -e
            cd ~/overbranch || cd /home/ubuntu/overbranch

            echo "[Deploy] Fetching overbranch/overbranch main..."
            git fetch --no-tags https://github.com/overbranch/overbranch.git refs/heads/main
            deploy_commit=$(git rev-parse FETCH_HEAD)
            git merge --ff-only "$deploy_commit"
            if [ "$(git rev-parse HEAD)" != "$deploy_commit" ]; then
              echo "[Deploy] The server checkout is ahead of overbranch/overbranch main." >&2
              exit 1
            fi

            bash docker/deploy-server.sh

            echo "[Deploy] Pruning old dangling Docker images..."
            docker image prune -f
