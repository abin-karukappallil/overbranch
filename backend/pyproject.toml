[project]
name = "overbranch-backend"
version = "0.1.0"
description = "OverBranch LaTeX & Agentic AI Backend Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "langchain-core>=0.1.0",
    "langchain-nvidia-ai-endpoints>=0.0.1",
    "supabase>=2.3.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "google-genai>=0.1.0",
    "qdrant-client>=1.7.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "rank-bm25>=0.2.2",
    "pylatexenc>=2.10",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "python-docx>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
