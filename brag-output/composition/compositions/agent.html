  <script>
    (function () {

      // Accept button centre in frame coordinates (window 120,236 + bar 230,682 + button 470..590)
      const AX = 120 + 2 + 230 + 1 + 470 + 60;
      const AY = 236 + 2 + 682 + 29;
      // Send button centre (chat 1060,62 inside window; input right/bottom 22; button right/bottom 14)
      const SX = 120 + 2 + 1060 + 616 - 22 - 2 - 14 - 22;
      const SY = 236 + 2 + 62 + 706 - 22 - 2 - 14 - 22;

      // Pushed in from the editor's agent input: lands slightly large around the input and settles
      tl.set("#ag-stage", { transformOrigin: "1490px 918px" }, 0);
      tl.fromTo("#ag-stage", { scale: 1.12, filter: "blur(12px)" }, { scale: 1, filter: "blur(0px)", duration: 0.36, ease: "expo.out" }, 0);
      tl.fromTo("#ag-kick", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.1);
      // Headline: per word from grey to ink
      tl.fromTo("#ag-head .ag-w", { color: "#3a3d45" }, { color: "#ffffff", duration: 0.1, ease: "power2.out", stagger: 0.08 }, 0.14);

      // Initial states
      tl.set(["#ag-ubub", "#ag-reason", "#ag-review", "#ag-cmp-b"], { opacity: 0 }, 0);
      tl.set("#ag-diff", { opacity: 0, clipPath: "inset(0% 0% 100% 0%)" }, 0);

      tl.to("#ag-send", { scale: 1, duration: 0.14, ease: "back.out(2)" }, 1.11);
      tl.set("#ag-typed", { opacity: 0 }, 1.09);
      tl.set("#ag-ph", { opacity: 1 }, 1.09);
      tl.fromTo("#ag-ubub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.22, ease: "expo.out" }, 1.09);
      tl.fromTo("#ag-reason", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.26, ease: "expo.out" }, 1.14);

          tl.set("#ag-s" + n, { opacity: 1 }, t);

          tl.set("#ag-s" + n, { opacity: 0 }, ends[i]);

      tl.to("#ag-hl", { opacity: 0, duration: 0.1 }, 1.64);

      tl.fromTo("#ag-review", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.26, ease: "expo.out" }, 1.95);

      tl.set("#ag-cmp-a", { opacity: 0 }, 2.17);
      tl.set("#ag-cmp-b", { opacity: 1 }, 2.17);
      tl.set("#ag-cmp-b", { opacity: 0 }, 2.73);
      tl.set("#ag-cmp-a", { opacity: 1 }, 2.73);

      // Cursor to Accept, click on the beat (14.73s)
      tl.to("#ag-cursor", { x: AX - 6, y: AY - 8, duration: 0.42, ease: "power2.inOut" }, 2.78);
      tl.to("#ag-cursor", { scale: 0.82, duration: 0.06, ease: "power2.in" }, 3.2);
      tl.to("#ag-accept", { scale: 0.93, duration: 0.06 }, 3.2);
      tl.to("#ag-cursor", { scale: 1, duration: 0.1 }, 3.27);

      // Iris from the click onto the poster green
      tl.fromTo(
        "#ag-iris",
        { clipPath: "circle(0px at " + AX + "px " + AY + "px)" },
        { clipPath: "circle(2300px at " + AX + "px " + AY + "px)", duration: 0.48, ease: "power2.in" },
        3.33,

    })();
