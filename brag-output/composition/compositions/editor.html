  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Camera framing inside the window: centre content point (cx, cy) at scale s, clamped to the frame
      const W = 1676, H = 766;
      const frame = (cx, cy, s) => ({
        scale: s,
        x: Math.min(0, Math.max(W - s * W, W / 2 - s * cx)),
        y: Math.min(0, Math.max(H - s * H, H / 2 - s * cy)),
      });
      const WIDE = frame(W / 2, H / 2, 1);
      const CODE = frame(620, 440, 1.36);   // title line to Sam's new section
      const PDF = frame(1061, 465, 1.5);    // the recompiled page
      const AGENT = frame(1380, 560, 1.35); // agent input, bottom right

      // Arrives from the decompile whip: lands blurred from the right and sharpens
      tl.fromTo("#ed-stage", { x: 900, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.36, ease: "power3.out" }, 0);
      tl.set(["#ed-kick-b", "#ed-head-b"], { opacity: 0 }, 0);
      tl.fromTo("#ed-kick-a", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.1);
      tl.fromTo("#ed-head-a .ed-w", { color: "#3a3d45" }, { color: "#ffffff", duration: 0.1, ease: "power2.out", stagger: 0.08 }, 0.14);

      // Recording: Compile clicked at 1.08 (18.00s), the PDF renders at 1.6
      tl.set("#ed-cam", WIDE, 0);

      // 2.17 the room goes Live; the headline swaps on one stage (blur out, blur in)
      tl.to(["#ed-kick-a", "#ed-head-a .ed-w"], { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in", stagger: 0.03 }, 2.24);
      tl.set(["#ed-kick-b", "#ed-head-b"], { opacity: 1 }, 2.44);
      tl.fromTo("#ed-kick-b", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 2.44);
      tl.fromTo("#ed-head-b .ed-w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out", stagger: 0.067 }, 2.46);

      // Punch into the code while Mia Chen selects and Sam Vance types (2.72-6.25)
      tl.to("#ed-cam", { ...CODE, duration: 0.75, ease: "power2.inOut" }, 2.55);
      // Back out for the recompile click (7.08 = 24.00s)
      tl.to("#ed-cam", { ...WIDE, duration: 0.55, ease: "power2.inOut" }, 6.4);
      // The page now carries "Mia Chen" and "3 Conclusion"
      tl.to("#ed-cam", { ...PDF, duration: 0.8, ease: "power2.inOut" }, 7.72);
      // Follow the cursor to the agent input, then push in: the next scene is that panel up close
      tl.to("#ed-cam", { ...AGENT, duration: 0.6, ease: "power2.inOut" }, 9.4);
      const PX = 122 + AGENT.x + AGENT.scale * 1495;
      const PY = 238 + AGENT.y + AGENT.scale * 734;
      tl.set("#ed-stage", { transformOrigin: PX + "px " + PY + "px" }, 10.3);
      tl.to("#ed-stage", { scale: 1.7, filter: "blur(12px)", duration: 0.56, ease: "power3.in" }, 10.35);

      window.__timelines["editor"] = tl;
    })();
