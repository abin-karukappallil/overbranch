services:
  backend:
    image: ${BACKEND_IMAGE:-overbranch-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: overbranch-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - WORKERS=${WORKERS:-2}
      - UPLOADS_BASE_DIR=/app/uploads/projects
    volumes:
      - ./uploads:/app/uploads
      - ./backend/templates:/app/backend/templates:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

