services:
  overbranch:
    image: ${DOCKER_IMAGE:-overbranch:latest}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      # deploy-server.sh overrides TEX_BASE with the host's cached image.
      args:
        TEX_BASE: ${TEX_BASE:-texlive-base}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    container_name: overbranch
    restart: always
    ports:
      - "3000:3000"
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WORKERS=${WORKERS:-2}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-https://overapi.overbranch.app}
      - BACKEND_URL=${BACKEND_URL:-https://overapi.overbranch.app}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://overbranch.app}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://overbranch.app}
    volumes:
      # Also holds in-flight PDF import jobs (uploads/pdf2latex_jobs): do not drop this mount or a
      # restart loses running conversions.
      - ./uploads:/app/uploads
      - ./backend/templates:/app/backend/templates:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

