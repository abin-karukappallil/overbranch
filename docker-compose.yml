services:
  overbranch:
    image: ${DOCKER_IMAGE:-abinthomasdotdev/overbranch:latest}
    build:
      context: .
      dockerfile: Dockerfile
      # The app image is built FROM the TeX base image. Build it first:
      #   docker build -f docker/texlive.Dockerfile -t overbranch-texlive:2026.1 .
      # (or run ./deploy.sh, which builds the base when it is missing).
      args:
        TEX_BASE: ${TEX_BASE:-overbranch-texlive:2026.1}
    container_name: overbranch
    restart: always
    ports:
      - "3000:3000"
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WORKERS=${WORKERS:-2}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-https://overapi.abinthomas.dev}
      - BACKEND_URL=${BACKEND_URL:-https://overapi.abinthomas.dev}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://overbranch.app}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://overbranch.app}
    volumes:
      # Also holds in-flight PDF import jobs (uploads/pdf2latex_jobs): do not drop this mount or a
      # restart loses running conversions.
      - ./uploads:/app/uploads
      - ./backend/templates:/app/backend/templates:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

