name = "overbranch"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[routes]]
pattern = "overbranch.abinthomas.dev"
zone_name = "abinthomas.dev"

[vars]
BETTER_AUTH_URL = "https://overbranch.abinthomas.dev"
NEXT_PUBLIC_APP_URL = "https://overbranch.abinthomas.dev"
NEXT_PUBLIC_BACKEND_URL = "https://overapi.abinthomas.dev"
BACKEND_URL = "https://overapi.abinthomas.dev"